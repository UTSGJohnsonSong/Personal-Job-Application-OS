<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; font: 13px system-ui; margin: 0; background: #0b0f17; color: #e5e7eb; }
      header { padding: 12px; border-bottom: 1px solid #1f2937; font-weight: 600; }
      .content { padding: 12px; }
      button { width: 100%; padding: 8px; background: #3b82f6; color: white; border: none;
               border-radius: 6px; cursor: pointer; }
      .note { color: #9ca3af; font-size: 11px; margin-top: 10px; line-height: 1.4; }
      #out { margin-top: 10px; font-size: 12px; color: #d1d5db; }
    </style>
  </head>
  <body>
    <header>Job OS Assist</header>
    <div class="content">
      <button id="scan">Scan this application page</button>
      <div id="out"></div>
      <p class="note">
        This assistant never clicks Submit and never sends data on its own.
        Final submission always requires per-job confirmation in the Job OS app.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
